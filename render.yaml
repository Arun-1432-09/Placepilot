services:
  - type: web
    name: placepilot
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python -m app.ml.train_model && python -m app.seed"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
